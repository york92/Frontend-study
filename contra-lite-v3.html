<div id="ctl"><div id="pad"><i id="kn"></i></div><div id="rt"><b class="s" data-k="start">START</b><b data-k="jump">JUMP</b><b data-k="fire">FIRE</b></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=256,H=224,LW=3072,MC=LW-W;
if('ontouchstart' in window||navigator.maxTouchPoints>0)document.body.classList.add('touch');
function fit(){const t=document.body.classList.contains('touch');let s=Math.min(innerWidth/W,(innerHeight-(t?150:0))/H);if(s>=2)s=Math.floor(s);C.style.width=W*s+'px';C.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
// ---- 音效 ----
let AC,NZ,mute=0;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}NZ=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NZ.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(AC.state=='suspended')AC.resume()}
function tone(f,d,ty,v,f2,dl){if(!AC||mute)return;const t=AC.currentTime+(dl||0),o=AC.createOscillator(),gn=AC.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,v,fc){if(!AC||mute)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();s.buffer=NZ;f.type='lowpass';f.frequency.value=fc;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(gn);gn.connect(AC.destination);s.start(t);s.stop(t+d)}
const seq=(a,d,v,g)=>a.forEach((f,i)=>tone(f,d,'square',v,0,i*g));
const S={shoot:()=>tone(900,.05,'square',.03,400),hit:()=>noise(.05,.07,3000),boom:()=>noise(.3,.2,900),big:()=>noise(.8,.3,500),jump:()=>tone(300,.1,'square',.03,600),
item:()=>seq([523,659,784,1047],.08,.05,.06),die:()=>tone(500,.5,'sawtooth',.07,50),over:()=>seq([392,330,262,196],.25,.06,.25),win:()=>seq([523,659,784,1047,784,1047],.15,.06,.13),start:()=>seq([330,392,523],.1,.05,.09)};
// ---- 关卡数据 ----
// 平台 [x0,x1,y,实心]: 实心地面不能下穿, 悬空台可站、可 下+跳 穿下
let P=[[0,520,192,1],[568,980,192,1],[1028,1400,192,1],[1452,1900,192,1],[1952,2400,192,1],[2448,3072,192,1],
[140,260,152,0],[300,400,120,0],[600,700,152,0],[720,820,112,0],[1100,1220,152,0],[1250,1330,120,0],[1500,1620,152,0],[1640,1760,120,0],[2000,2100,152,0],[2130,2230,112,0],[2500,2600,152,0]];
const P1=P;
const SE=[['sn',340,120],['sn',760,112],['tu',900,192],['sn',1160,152],['sn',1290,120],['tu',1350,192],['sn',1700,120],['tu',1800,192],['sn',2170,112],['tu',2300,192],['tu',2570,192],['bc',3004,92],['bc',3004,162],['bk',3030,146]];
const CP=[[380,1],[1100,3],[1800,4],[2300,2]],ZN=[[150,500],[560,980],[1040,1400],[1460,1900],[1960,2360]];
const D={rk:[12,12,2],run:[10,22,1],sn:[10,22,1],tu:[16,16,6],bc:[14,14,12],bk:[20,28,35],cap:[14,10,1],item:[14,12,1]};
const WP=[{cd:9,mx:4,sp:4.5,n:'N'},{cd:13,mx:12,sp:4,n:'S'},{cd:4,mx:6,sp:5.5,n:'R'},{cd:16,mx:3,sp:7,n:'L'},{cd:14,mx:6,sp:3,n:'F'}],WC=['#ddd','#e83030','#f8c020','#38d8f8','#f87818'];
// ---- 状态 ----
let st='title',fr=0,score=0,lives=3,wp=0,cam=0,paused=0,jb=0,bossDown=0,wt=0,rz=0;
let p={},en=[],bu=[],ex=[],ents=[],caps=[];
let stg=1,fin=0,mi=0,si=0,q={},en2=[],pb=[],eb=[],t2=0,coreOn=0,camY=0,ents3=[];
const HT={se:[44,62],co:[40,90],so:[0,26]};
const CF=[['DIFFICULTY',['EASY','NORMAL','HARD'],1],['LIVES',['3','5','9'],0],['RUN SPEED',['SLOW','NORMAL','FAST'],1],['JUMP HEIGHT',['LOW','NORMAL','HIGH'],1],['FIRE RATE',['SLOW','NORMAL','FAST'],1],['HITBOX',['LARGE','NORMAL','SMALL'],1],['AIR STEER',['ORIGINAL','FREE'],1]];
let cfg=CF.map(c=>c[2]);try{const j=JSON.parse(localStorage.clc);if(j&&j.length==CF.length)cfg=j}catch(e){}
const cfgSave=()=>{try{localStorage.clc=JSON.stringify(cfg)}catch(e){}};
const DF=()=>[[1.4,.8],[1,1],[.65,1.25]][cfg[0]],LV=()=>[3,5,9][cfg[1]],SP=()=>[1.3,1.6,2][cfg[2]],JH=()=>[5,5.6,6.2][cfg[3]],FR=()=>[1.5,1,.7][cfg[4]],HB=()=>[7,5,3.5][cfg[5]];
const held={},rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),DEG=Math.PI/180;
const mk=(t,x,y,o)=>{const d=D[t];return Object.assign({t,x,y,w:d[0],h:d[1],hp:d[2],vx:0,vy:0,cd:rnd(30,90),an:0,f:-1,hit:0,ang:Math.PI,aim:[-1,0]},o)};
function newGame(){score=0;lives=LV();wp=0;startStage(stg)}
function startStage(n){stg=n;cam=0;bossDown=0;wt=0;rz=60;paused=0;en=[];bu=[];ex=[];fin=0;
 ents=SE.map(a=>({t:a[0],x:a[1],y:a[2],s:0}));caps=CP.map(a=>({x:a[0],k:a[1],s:0}));
 if(n==2)initQ();else if(n==3)init3();else{P=P1;resp(40)}st='play';S.start()}
const ground=x=>P.some(q=>q[3]&&x>=q[0]+6&&x<=q[1]-6);
function resp(x0){let x=x0==null?cam+40:x0;while(!ground(x)&&x<cam+W-20)x+=8;p={x,y:-10,vx:0,vy:0,f:1,on:0,sol:1,pr:0,cd:0,inv:150,dead:0,an:0,drop:0,coy:0,aim:[1,0],w:8,h:22};wp=0;if(stg==3){const L=P.find(q=>q[2]>camY+30&&q[2]<camY+H-30)||P[0];p.x=(L[0]+L[1])/2;p.y=L[2]-1}}
function boom(x,y,big){ex.push({x,y,t:0,big});}
function fall(o){o.vy=Math.min(o.vy+.26,6);const ny=o.y+o.vy;let L=0;
 if(o.vy>=0)for(const q of P)if(o.x>=q[0]-2&&o.x<=q[1]+2&&o.y<=q[2]+.01&&ny>=q[2]&&!(o.drop>0&&!q[3])){o.y=q[2];o.vy=0;o.sol=q[3];L=1;break}
 if(!L)o.y=ny;return L}
function die(){if(p.inv>0||p.dead)return;p.dead=70;lives--;boom(p.x,p.y-12,0);S.die()}
function efire(x,y,a,sp){sp*=DF()[1];bu.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,o:'e'});}
// ---- 玩家 ----
function upP(){
 if(p.dead){if(--p.dead==0){if(lives<=0){st='over';S.over()}else resp()}return}
 const dx=(held.right?1:0)-(held.left?1:0),dy=(held.down?1:0)-(held.up?1:0);
 if(dx)p.f=dx;
 p.pr=!!(p.on&&dy>0&&!dx);
 if(p.on)p.vx=p.pr?0:dx*SP();else if(dx&&cfg[6])p.vx=dx*SP();
 if(p.on)p.coy=6;else if(p.coy>0)p.coy--;
 if(jb>0){jb--;if(p.coy>0){if(p.pr&&!p.sol){p.drop=14;p.y+=1;p.vy=0}else{p.vy=-JH();S.jump()}p.on=0;p.coy=0;jb=0}}
 if(p.vy<-2.2&&!held.jump)p.vy=-2.2;
 if(p.drop>0)p.drop--;if(p.inv>0)p.inv--;if(p.cd>0)p.cd--;
 {const m=stg==3?26:8;p.x=Math.max(cam+m,Math.min(cam+W-m,2980,p.x+p.vx))}
 p.on=fall(p);if(p.on&&p.vx)p.an++;
 if(p.y>(stg==3?camY:0)+H+8){p.inv=0;die();return}
 let ax=dx,ay=dy;
 if(p.pr){ax=p.f;ay=0}else if(!ax&&!ay)ax=p.f;
 const l=Math.hypot(ax,ay);p.aim=[ax/l,ay/l];
 const w=WP[wp];
 if(held.fire&&p.cd<=0&&bu.filter(b=>b.o=='p').length<w.mx){
  const a0=Math.atan2(p.aim[1],p.aim[0]),oy=p.y-(p.pr?5:16);
  if(wp==4)[0,Math.PI].forEach(ph=>{const X0=p.x+p.aim[0]*10,Y0=oy+p.aim[1]*10;bu.push({x:X0,y:Y0,ox:X0,oy:Y0,ux:p.aim[0],uy:p.aim[1],t:0,ph,f:1,sp:w.sp,d:2,o:'p'})});
  else for(const o of wp==1?[-.36,-.18,0,.18,.36]:[0])bu.push({x:p.x+p.aim[0]*10,y:oy+p.aim[1]*10,vx:Math.cos(a0+o)*w.sp,vy:Math.sin(a0+o)*w.sp,o:'p',pr:wp==3,d:wp==3?2:1,L:wp==3});
  p.cd=Math.round(w.cd*FR());S.shoot()}}
// ---- 敌人 ----
const onS=e=>e.x>cam&&e.x<cam+W;
function kill(e){e.dead=1;const sc={run:100,sn:200,tu:300,bc:500,bk:5000,cap:100}[e.t]||0;score+=sc;boom(e.x,e.y-e.h/2,e.t=='bk');e.t=='bk'?S.big():S.boom();

 if(e.t=='bk'){bossDown=1;bu=bu.filter(b=>b.o=='p')}}
function upE(){
 for(const e of ents)if(!e.s&&cam+W+20>e.x){e.s=1;en.push(mk(e.t,e.x,e.y))}
 for(const c of caps)if(!c.s&&cam>=c.x){c.s=1;en.push(mk('cap',cam+W+10,60,{k:c.k,y0:60+rnd(0,30)}))}
 if(!bossDown&&--rz<=0){rz=Math.round(rnd(70,130)*DF()[0]);const z=ZN.find(z=>cam>=z[0]&&cam<z[1]),x=cam+W+10;
  if(z&&ground(x)&&en.filter(e=>e.t=='run').length<3)en.push(mk('run',x,192))}
 const bcAlive=en.some(e=>e.t=='bc');
 for(const e of en){e.an++;if(e.hit>0)e.hit--;
  const dxp=p.x-e.x,ang=Math.atan2(p.y-14-(e.y-e.h/2),dxp);
  if(e.t=='run'){e.x-=1.1;e.f=-1;fall(e);if(e.y>H+20||e.x<cam-20)e.dead=1}
  else if(e.t=='sn'){e.f=dxp>0?1:-1;e.ang=ang;const l=Math.hypot(Math.cos(ang),Math.sin(ang));e.aim=[Math.cos(ang),Math.sin(ang)];if(onS(e)&&!p.dead&&--e.cd<=0){efire(e.x,e.y-16,ang,2.2);e.cd=Math.round(100*DF()[0])}}
  else if(e.t=='tu'||e.t=='bc'){e.ang=ang;if(onS(e)&&Math.abs(dxp)<230&&!p.dead&&--e.cd<=0){efire(e.x,e.y-e.h/2,ang,1.8);e.cd=Math.round((e.t=='bc'?90:80)*DF()[0])}}
  else if(e.t=='bk'){if(!bcAlive&&!bossDown&&--e.cd<=0){for(const o of[-.3,0,.3])efire(e.x,e.y-14,ang+o,1.6);e.cd=Math.round(100*DF()[0])}}
  else if(e.t=='rk'){e.vy=Math.min(e.vy+.12,4);e.y+=e.vy;if(e.y>camY+H+30)e.dead=1;if(!p.dead&&Math.abs(p.x-e.x)<HB()+5&&Math.abs((p.y-12)-(e.y-6))<14)die()}
  else if(e.t=='cap'){e.x-=.9;e.y=e.y0+Math.sin(e.an/18)*28;if(e.x<cam-20)e.dead=1}
  else if(e.t=='item'){if(!fall(e)&&e.y>H+20)e.dead=1;if(!p.dead&&Math.abs(p.x-e.x)<12&&p.y>e.y-30&&p.y<e.y+12){e.dead=1;wp=e.k;score+=500;S.item()}}
  if(e.t=='run'&&!p.dead&&Math.abs(p.x-e.x)<HB()+4&&p.y>e.y-22&&p.y-(p.pr?10:22)<e.y)die()}
 en=en.filter(e=>!e.dead)}
function upB(){
 for(const b of bu){if(b.f){b.t++;const s=b.sp*b.t,of=Math.sin(b.t*.35+b.ph)*9;b.x=b.ox+b.ux*s-b.uy*of;b.y=b.oy+b.uy*s+b.ux*of}else{b.x+=b.vx;b.y+=b.vy}
  if(b.x<cam-16||b.x>cam+W+16||b.y<(stg==3?camY:0)-16||b.y>(stg==3?camY:0)+H+16){b.dead=1;continue}
  if(b.o=='p'){for(const e of en)if(e.t!='item'&&Math.abs(b.x-e.x)<e.w/2+2&&b.y>e.y-e.h-2&&b.y<e.y+2){if(b.h&&b.h.includes(e))continue;if(!b.pr)b.dead=1;else(b.h=b.h||[]).push(e);
    if(e.t=='bk'&&en.some(q=>q.t=='bc')){b.dead=1;S.hit();break}
    e.hit=3;S.hit();e.hp-=b.d||1;if(e.hp<=0)kill(e);if(!b.pr)break}}
  else if(!p.dead&&Math.abs(b.x-p.x)<HB()&&b.y>p.y-(p.pr?10:22)&&b.y<p.y){b.dead=1;die()}}
 bu=bu.filter(b=>!b.dead)}
function upd(){
 fr++;if(st!='play'||paused)return;
 if(stg==2)upQ();else{upP();upE();upB();if(stg==1)cam=Math.max(cam,Math.min(MC,p.x-110));else{spawn3();camY=Math.min(camY,Math.max(0,p.y-125))}}
 ex.forEach(e=>e.t++);ex=ex.filter(e=>e.t<(e.big?30:18));
 if(bossDown){wt++;if(wt%7==0){boom(stg==3?rnd(80,176):stg==2?rnd(90,166):rnd(2996,3064),stg==3?rnd(40,110):stg==2?rnd(50,110):rnd(70,190),1);S.boom()}if(wt>160){st='win';fin=stg==3;S.win()}}}
// ---- 绘制 ----
const sky=X.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#1c2c6c');sky.addColorStop(.6,'#3c8c9c');sky.addColorStop(1,'#8cc8a0');

function man(x,y,f,pr,an,a,c1,c2){x=Math.round(x);y=Math.round(y);X.fillStyle=c1;
 if(pr){X.fillRect(x-10,y-7,20,7);X.fillStyle='#f0c090';X.fillRect(x+f*8-3,y-12,6,5);X.fillStyle='#ddd';X.fillRect(f>0?x+8:x-18,y-6,10,2);return}
 const s=(an>>2)&1;X.fillRect(x-4,y-10,3,10-s);X.fillRect(x+1,y-10,3,9+s);X.fillRect(x-4,y-18,8,9);
 X.fillStyle='#f0c090';X.fillRect(x-3,y-24,6,6);X.fillStyle=c2;X.fillRect(x-3,y-23,6,2);
 X.strokeStyle='#ddd';X.lineWidth=2;X.beginPath();X.moveTo(x,y-15);X.lineTo(x+a[0]*10,y-15+a[1]*10);X.stroke()}
function barrel(x,y,a,l){X.strokeStyle='#ddd';X.lineWidth=3;X.beginPath();X.moveTo(x,y);X.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);X.stroke()}
function draw(){
 const cx=Math.floor(cam),s3=stg==3&&st!='title'&&st!='set',cy=s3?Math.floor(camY):0;if(stg==2&&st!='title'&&st!='set')draw2();else{
 if(s3)bg3(cy);else{X.fillStyle=sky;X.fillRect(0,0,W,H);
 X.fillStyle='#2c6a58';for(let i=0;i<W;i+=4){const h=50+28*Math.sin((i+cx*.25)/38)+16*Math.sin((i+cx*.25)/13);X.fillRect(i,170-h,4,h)}
 X.fillStyle='#14502c';const o=cx*.55;for(let k=Math.floor(o/40);k<o/40+8;k++){const x=Math.round(k*40-o);X.fillRect(x+10,124,4,70);X.fillRect(x,114,24,10);X.fillRect(x+4,107,16,7)}
 X.fillStyle='#1c3cc8';X.fillRect(0,208,W,16);X.fillStyle='#78b0f8';for(let i=0;i<W;i+=16)X.fillRect(i+((fr>>4)&1)*6,212,6,1);
 }X.save();X.translate(0,-cy);for(const q of P){const x=q[0]-cx,w=q[1]-q[0];if(x>W||x+w<0)continue;
  if(q[3]){X.fillStyle='#6a4a20';X.fillRect(x,q[2],w,Math.max(6,208-q[2]));X.fillStyle='#3a9a3a';X.fillRect(x,q[2],w,5);X.fillStyle='#2a7a2a';for(let i=0;i<w;i+=6)X.fillRect(x+i,q[2]+5,3,2)}
  else{X.fillStyle='#6a4a20';X.fillRect(x,q[2]+3,w,5);X.fillStyle='#3a9a3a';X.fillRect(x,q[2],w,4)}}
 const wx=2992-cx;if(s3){X.fillStyle='#6c7480';X.fillRect(80,30,96,80);X.fillStyle='#4c545c';for(let y=34;y<106;y+=12)X.fillRect(80,y,96,2)}else if(wx<W){X.fillStyle='#6c7480';X.fillRect(wx,56,80,136);X.fillStyle='#4c545c';for(let y=60;y<190;y+=12)X.fillRect(wx,y,80,2);X.fillRect(wx+4,56,4,136)}
 for(const e of en){const x=Math.round(e.x-cx),y=Math.round(e.y);
  if(e.t=='run')man(x,y,-1,0,e.an,[-1,0],'#7c8490','#7c8490');
  else if(e.t=='sn')man(x,y,e.f,0,0,e.aim,'#a03030','#f0f0f0');
  else if(e.t=='tu'||e.t=='bc'){X.fillStyle=e.hit?'#fff':'#555';X.fillRect(x-e.w/2,y-e.h/2,e.w,e.h/2);X.fillStyle=e.hit?'#fff':'#888';X.fillRect(x-e.w/2+2,y-e.h,e.w-4,e.h/2);barrel(x,y-e.h/2-1,e.ang,10)}
  else if(e.t=='bk'){X.fillStyle=e.hit?'#fff':en.some(q=>q.t=='bc')?'#586068':'#e04020';X.fillRect(x-10,y-28,20,28);X.fillStyle='#000';X.fillRect(x-5,y-18,10,8);X.fillStyle='#f8d800';X.fillRect(x-2,y-16,4,4)}
  else if(e.t=='rk'){X.fillStyle=e.hit?'#fff':'#8a7a68';X.beginPath();X.arc(x,y-6,6,0,7);X.fill();X.fillStyle='#5a4a3a';X.fillRect(x-2,y-8,3,3)}
  else if(e.t=='cap'){X.fillStyle='#bbb';X.fillRect(x-7,y-10,14,10);X.fillStyle='#e03030';X.fillRect(x-3,y-8,6,6);X.fillRect(x-10,y-6,3,3);X.fillRect(x+7,y-6,3,3)}
  else if(e.t=='item'){X.fillStyle='#fff';X.fillRect(x-8,y-14,16,14);X.fillStyle=WC[e.k];X.fillRect(x-7,y-13,14,12);tx(WP[e.k].n,x,y-12,'#000',10,'center')}}
 if(!p.dead&&!(p.inv>0&&(fr>>2)&1)){const x=Math.round(p.x-cx);
