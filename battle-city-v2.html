// ---- 关卡 ('.'空 B砖 S钢 F林 I冰 W水) ----

".............|.B.B.B.B.B.B.|SSSSS...SSSSS|.............|.BBB.FFF.BBB.|.BBB.FFF.BBB.|.............|WWW.SSS.WWW..|.............|.B.B.....B.B.|.B.B.III.B.B.|.B.B.....B.B.|.............",

const TM={'.':0,B:1,S:2,F:3,I:4,W:5},DI={up:0,right:1,down:2,left:3};
const NB=20; // 内置20关(1-10手工, 11-20种子生成), 第21个为自定义关
function gen(n){let s=n*7919+13;const R=()=>((s=Math.imul(s^s>>>15,2246822507)+1013904223|0)>>>0)/4294967296;
 const P='BBBBBSSFIW',d=.3+(n-10)*.015,m=[];
 for(let r=0;r<13;r++){const a=Array(13).fill('.');
  if(r>0&&r<11){for(let c=0;c<=6;c++)if(R()<d){a[c]=a[12-c]=P[Math.floor(R()*P.length)]}
   if(r%3==2&&R()<.5){const c0=Math.floor(R()*3)*2,t=R()<.5?'B':'S';for(let c=c0;c<c0+3;c++)a[c]=a[12-c]=t}}
  m.push(a.join(''))}
 return m.join('|')}
for(let i=10;i<NB;i++)LV.push(gen(i));
{let cm;try{cm=localStorage.btm}catch(e){}LV[NB]=cm||Array(13).fill('.'.repeat(13)).join('|')}
const K={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'fire',KeyJ:'fire',KeyZ:'fire',KeyK:'fire',Enter:'start',KeyP:'start',KeyM:'mute',Escape:'esc'};
// ---- 音效 (WebAudio 合成) ----
let AC,NZ,mute=0;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}NZ=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NZ.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(AC.state=='suspended')AC.resume()}
function tone(f,d,ty,v,f2,dl){if(!AC||mute)return;const t=AC.currentTime+(dl||0),o=AC.createOscillator(),gn=AC.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,v,fc){if(!AC||mute)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();s.buffer=NZ;f.type='lowpass';f.frequency.value=fc;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(gn);gn.connect(AC.destination);s.start(t);s.stop(t+d)}
const seq=(a,d,v,g)=>a.forEach((f,i)=>tone(f,d,'square',v,0,i*g));
const S={shoot:()=>tone(700,.08,'square',.05,300),brick:()=>noise(.06,.1,1500),steel:()=>tone(180,.07,'square',.06),boom:()=>noise(.4,.22,900),big:()=>noise(.8,.3,500),
up:()=>seq([523,659,784,1047],.1,.06,.07),start:()=>seq([392,523,659,784],.12,.06,.1),over:()=>seq([392,330,262,196],.25,.07,.25),win:()=>seq([523,659,784,1047,784,1047],.15,.06,.13)};
// ---- 状态 ----
let st='title',lvl=0,hi=0,fr=0,score=0,lives=2,star=0,stT=0,paused=0;
let en=[],sps=[],bu=[],ex=[],pp=[],pu=null,p={alive:0,x:0,y:0},q=[],qi=0,spT=0,spi=0,fz=0,svT=0,clr=0,eag=1,over=0,overT=0;
try{hi=+localStorage.bt||0}catch(e){}
let mi=0,si=0,et=1,ecx=6,ecy=6,ret='title',ed=[];
const CF=[['DIFFICULTY',['EASY','NORMAL','HARD'],1],['TANK SPEED',['SLOW','NORMAL','FAST'],1],['BULLET SPEED',['SLOW','NORMAL','FAST'],1],['FIRE RATE',['SLOW','NORMAL','FAST'],1],['ICE SLIDE',['OFF','ON'],1],['LIVES',['1','2','3','5'],2]];
let cfg=CF.map(c=>c[2]);try{const j=JSON.parse(localStorage.btc);if(j&&j.length==CF.length)cfg=j}catch(e){}
const DF=()=>[[.8,1.5,1.3,3],[1,1,1,4],[1.25,.6,.7,5]][cfg[0]],SPD=()=>[.8,1,1.3][cfg[1]],BSP=()=>[.7,1,1.4][cfg[2]],CD=()=>[22,14,8][cfg[3]],LIVES=()=>[0,1,2,4][cfg[5]];
const cfgSave=()=>{try{localStorage.btc=JSON.stringify(cfg)}catch(e){}};
const g=new Uint8Array(676),held={},ds=[];
const blk=(r,c,v)=>{for(let i=0;i<4;i++)g[(2*r+(i>>1))*26+2*c+(i&1)]=v};
const base=v=>{[[11,5],[11,6],[11,7],[12,5],[12,7]].forEach(([r,c])=>blk(r,c,v));blk(12,6,6)};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const ov=(a,b,c,d,e,f,h,i)=>a<e+h&&a+c>e&&b<f+i&&b+d>f;
function load(n){
 const rows=LV[n].split('|');
 for(let r=0;r<13;r++)for(let c=0;c<13;c++)blk(r,c,TM[(rows[r]||'')[c]||'.']||0);
 [[0,0],[0,6],[0,12],[12,4]].forEach(([r,c])=>blk(r,c,0));base(1);
 en=[];sps=[];bu=[];ex=[];pp=[];pu=null;qi=0;spT=40;spi=0;fz=0;svT=0;clr=0;eag=1;over=0;overT=0;paused=0;
 q=[];for(let i=0;i<20;i++){const r=Math.random(),m=Math.min(n,9),a=.04+m*.035,w=.1+m*.02;q.push(r<a?3:r<a+w?2:r<a+w+.2?1:0)}
 spawnP();
}
function spawnP(){p={x:64,y:192,d:0,alive:1,sh:180,cd:0,an:0,rt:0,sl:0}}
function begin(n){score=0;lives=LIVES();star=0;lvl=n;start(n)}
function start(n){load(n);st='stage';stT=100;S.start()}
function setOver(){if(over)return;over=1;hi=Math.max(hi,score);try{localStorage.bt=hi}catch(e){}S.over()}

// ---- 碰撞与移动 ----
const solid=v=>v==1||v==2||v==5||v==6;
function blocked(t,nx,ny){
 if(nx<0||ny<0||nx>192||ny>192)return 1;
 const x0=Math.floor(nx/8),x1=Math.floor((nx+15.99)/8),y0=Math.floor(ny/8),y1=Math.floor((ny+15.99)/8);
 for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++)if(solid(g[cy*26+cx]))return 1;
 if(t!==p&&p.alive&&ov(nx,ny,16,16,p.x,p.y,16,16))return 1;
 for(const e of en)if(e!==t&&ov(nx,ny,16,16,e.x,e.y,16,16))return 1;
 return 0}
function mv(t,d,s){
 if(t.d!=d){if(t.d%2!=d%2){const ox=t.x,oy=t.y;if(d%2)t.y=Math.round(t.y/8)*8;else t.x=Math.round(t.x/8)*8;if(blocked(t,t.x,t.y)){t.x=ox;t.y=oy}}t.d=d}
 const nx=t.x+(d==1?s:d==3?-s:0),ny=t.y+(d==2?s:d==0?-s:0);
 if(blocked(t,nx,ny))return 0;t.x=nx;t.y=ny;t.an++;return 1}
function shoot(t,o){const d=t.d;bu.push({x:t.x+(d==1?12:d==3?0:6),y:t.y+(d==2?12:d==0?0:6),d,o,own:t,sp:Math.max(1,Math.round((o=='p'?(star>=1?5:3):(t.ty==2?4:2))*BSP())),pw:o=='p'&&star>=3?3:0});if(o=='p')S.shoot()}
function boom(x,y,big){ex.push({x,y,t:0,big});}
function hitc(c,r,b){const i=r*26+c,v=g[i];
 if(v==1){g[i]=0;if(b.o=='p')S.brick()}
 else if(v==2){if(b.pw>=3){g[i]=0;S.brick()}else if(b.o=='p')S.steel()}
 else if(v==6&&eag){eag=0;boom(104,200,1);S.big();setOver()}}
function killP(){boom(p.x+8,p.y+8,1);S.big();p.alive=0;star=0;lives--;if(lives<0)setOver();else p.rt=90}
function hitE(e){
 if(e.fl){e.fl=0;dropPU()}
 if(--e.hp>0){S.steel();return}
 en.splice(en.indexOf(e),1);const pt=[100,200,300,400][e.ty];score+=pt;pp.push({x:e.x,y:e.y,t:40,s:pt});boom(e.x+8,e.y+8,0);S.boom()}
function bst(b){
 const d=b.d;b.x+=d==1?1:d==3?-1:0;b.y+=d==2?1:d==0?-1:0;
 if(b.x<0||b.y<0||b.x>204||b.y>204){b.dead=1;if(b.o=='p')S.steel();return}
 const cs=[];
 if(d%2==0){const r=Math.floor((d?b.y+3:b.y)/8);for(let c=Math.floor(b.x/8);c<=Math.floor((b.x+3)/8);c++)cs.push([c,r])}
 else{const c=Math.floor((d==1?b.x+3:b.x)/8);for(let r=Math.floor(b.y/8);r<=Math.floor((b.y+3)/8);r++)cs.push([c,r])}
 let h=0;for(const[c,r]of cs){const v=g[r*26+c];if(v==1||v==2||v==6)h=1}
 if(h){b.dead=1;for(const[c,r]of cs){hitc(c,r,b);if(b.pw>=3){const c2=c+(d==1?1:d==3?-1:0),r2=r+(d==2?1:d==0?-1:0);if(c2>=0&&c2<26&&r2>=0&&r2<26)hitc(c2,r2,b)}}return}
 if(b.o=='p'){for(const e of en)if(ov(b.x,b.y,4,4,e.x,e.y,16,16)){b.dead=1;hitE(e);return}}
 else if(p.alive&&ov(b.x,b.y,4,4,p.x,p.y,16,16)){b.dead=1;if(p.sh<=0)killP()}}
function upB(){
 for(const b of bu)for(let i=0;i<b.sp&&!b.dead;i++)bst(b);
 for(const a of bu)if(a.o=='p'&&!a.dead)for(const c of bu)if(c.o=='e'&&!c.dead&&ov(a.x-1,a.y-1,6,6,c.x-1,c.y-1,6,6))a.dead=c.dead=1;
 bu=bu.filter(b=>!b.dead)}
// ---- 道具 ----
function dropPU(){for(let k=0;k<40;k++){const c=1+rnd(0,10),r=1+rnd(0,10);let ok=1;for(let i=0;i<4;i++)if(g[(2*r+(i>>1))*26+2*c+(i&1)])ok=0;if(ok){pu={t:rnd(0,5),x:c*16,y:r*16};return}}}
function getPU(t){S.up();score+=500;
 if(t==0)star=Math.min(3,star+1);else if(t==1)lives++;else if(t==2)p.sh=600;else if(t==3)fz=600;

function upP(){
 if(!p.alive){if(p.rt&&!--p.rt)spawnP();return}

 const ice=g[Math.floor((p.y+8)/8)*26+Math.floor((p.x+8)/8)]==4;
 if(d>=0){mv(p,d,SPD());if(ice&&cfg[4])p.sl=18}else if(p.sl>0){p.sl--;mv(p,p.d,1)}
 if(held.fire&&p.cd<=0&&bu.filter(b=>b.o=='p').length<(star>=2?2:1)){shoot(p,'p');p.cd=CD()}
 if(pu&&ov(p.x,p.y,16,16,pu.x,pu.y,16,16)){const t=pu.t;pu=null;getPU(t)}}
function upE(e){
 if(fz>0)return;
 if(!mv(e,e.d,e.s*DF()[0])||--e.tt<=0){const r=Math.random();e.d=r<.4?2:r<.65?(e.x<96?1:3):rnd(0,3);e.tt=rnd(60,200)}

  if(!sps.some(s=>s.x==x)&&!blocked({},x,y)){sps.push({x,y,t:70,ty:q[qi],fl:[3,10,17].includes(qi)});qi++;spT=Math.max(50,(200-lvl*10)*DF()[2])}}}
function upd(){
 fr++;if(st=='edit'&&held.fire)paint(ecy,ecx);

 upB();

// ---- 绘制 ----
function tx(s,x,y,c,z,a){X.font='bold '+(z||8)+'px "Courier New",monospace';X.fillStyle=c;X.textAlign=a||'left';X.textBaseline='top';X.fillText(s,x,y)}

 X.save();X.translate(Math.round(x)+8,Math.round(y)+8);X.rotate(d*Math.PI/2);

function dTer(f){
 for(let cy=0;cy<26;cy++)for(let cx=0;cx<26;cx++){const v=g[cy*26+cx];if(!v||v==6||(v==3)!=!!f)continue;const x=cx*8,y=cy*8;

  else if(v==3){X.fillStyle='#0a5a0a';X.fillRect(x,y,8,8);X.fillStyle='#40c040';X.fillRect(x+1,y+1,2,2);X.fillRect(x+5,y+2,2,2);X.fillRect(x+2,y+5,2,2);X.fillRect(x+6,y+6,1,1)}
  else{X.fillStyle='#c8dcf0';X.fillRect(x,y,8,8);X.fillStyle='#fff';X.fillRect(x,y+3,8,1);X.fillRect(x+4,y,1,8)}}}
function dEagle(){X.save();X.translate(96,192);

const PC=['★','♥','H','T','S','B'];
function draw(){
 X.fillStyle='#000';X.fillRect(0,0,240,208);
 if(st=='title'){
  tx('BATTLE',120,10,'#e07020',24,'center');tx('CITY',120,36,'#e07020',24,'center');
